# Phase 0 · Lesson 07 — Docker for AI (CPU adaptation of docker-compose.yml).
# Removes the NVIDIA deploy block (no GPU). See Dockerfile.cpu.
# See docs/en.md "No GPU?" section in this lesson directory.

services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    volumes:
      - ../../../:/workspace
      - ~/models:/models
      - ~/datasets:/data
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: